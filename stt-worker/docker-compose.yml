# Local development compose — CPU by default.
# For GPU: docker-compose -f docker-compose.yml -f docker-compose.gpu.yml up
#
# Environment variables you can override via a local .env file or export:
#   COMPUTE          cpu | gpu          (build-time, default: cpu)
#   DEVICE           cpu | cuda         (runtime, default: cpu)
#   COMPUTE_TYPE     int8 | float16 | auto (runtime, default: auto-selected by engine)
#   HF_TOKEN         HuggingFace token  (needed only for gated models)
#   ASR_MODEL_PATH   path inside container where model lives (default: /models/hf/indic-conformer)

services:
  worker:
    build:
      context: .
      args:
        COMPUTE: ${COMPUTE:-cpu}
        PRELOAD_ASR_MODEL: ${PRELOAD_ASR_MODEL:-false}
        ASR_MODEL_ID: ${ASR_MODEL_ID:-ai4bharat/indic-conformer-600m-multilingual}
        ASR_MODEL_REVISION: ${ASR_MODEL_REVISION:-}
        HF_TOKEN: ${HF_TOKEN:-}
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - STT_JOBS_TOPIC=stt.jobs
      - STT_RESULTS_TOPIC=stt.results
      - STT_DLQ_TOPIC=stt.jobs.dlq
      - LOG_LEVEL=INFO
      - STT_ENGINE=indicconformer
      - STT_ENABLE_FALLBACK=true
      - STT_DEFAULT_LANG=mr
      - ASR_MODEL_ID=ai4bharat/indic-conformer-600m-multilingual
      - ASR_DECODING=rnnt
      - STT_ALLOW_RUNTIME_MODEL_DOWNLOAD=true
      - HF_HOME=/models/hf
      - TMP_DIR=/app/tmp
      - HF_TOKEN=${HF_TOKEN:-}
      - ASR_MODEL_PATH=${ASR_MODEL_PATH:-/models/hf/indic-conformer}
      - AUDIO_DOWNLOAD_RETRIES=2
      - AUDIO_DOWNLOAD_BACKOFF_SEC=0.5
      - MODEL_SIZE=small
      # Switch DEVICE=cuda when using the GPU override
      - DEVICE=${DEVICE:-cpu}
      # Leave blank to let engine auto-select (int8 for cpu, float16 for cuda)
      - COMPUTE_TYPE=${COMPUTE_TYPE:-}
    ports:
      - "9108:9108"
      - "8081:8081"
    networks:
      - oolshik-backend-otp_default
    volumes:
      - ../models/hf:/models/hf

networks:
  oolshik-backend-otp_default:
    external: true
