server:
  forward-headers-strategy: framework

spring:
  flyway:
    locations:
      - classpath:db/migration
  kafka:
    consumer:
      group-id: oolshik-stt-backend
  jpa:
    properties:
      hibernate:
        format_sql: false

app:
  zone:
    bypass-when-no-zones-active: false
  messaging:
    kafka:
      enabled: true
  docs:
    enabled: false
  admin:
    seed:
      enabled: false
  security:
    identity-provider: firebase
  otp:
    provider: msg91
    dev:
      enabled: false
  transcription:
    audioSourceMode: S3_ONLY

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN

media:
  local:
    publicStreamEnabled: false
  s3:
    provider: aws
    region: ap-south-1
    prefix: audio/
    pathStyleAccessEnabled: false
    downloadUrlMode: presigned_get
    presignedGetTtlSeconds: 900
