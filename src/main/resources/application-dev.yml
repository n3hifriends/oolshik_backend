spring:
  flyway:
    locations:
      - classpath:db/migration
    ignore-migration-patterns:
      - "*:missing"

app:
  admin:
    seed:
      enabled: true
      reset-existing-password: true
  security:
    identity-provider: local
  messaging:
    kafka:
      enabled: true
      stt:
        enabled: true
  otp:
    provider: dev
    dev:
      enabled: true
  cors:
    allowedOrigins:
      - "*"
