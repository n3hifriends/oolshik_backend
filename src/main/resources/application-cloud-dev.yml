# cloud-dev profile: Neon DB + msg91 OTP + S3 storage. Used for cloud staging.
# .env: SPRING_PROFILES_ACTIVE=cloud-dev  APP_DB_MODE=neon
#        NEON_DATASOURCE_URL=...  NEON_DATASOURCE_USERNAME=...  NEON_DATASOURCE_PASSWORD=...
#        APP_OTP_MSG91_API_KEY=...  MEDIA_S3_BUCKET=...  JWT_SECRET=...

server:
  forward-headers-strategy: framework

spring:
  flyway:
    locations:
      - classpath:db/migration
  kafka:
    consumer:
      group-id: oolshik-stt-backend
  jpa:
    properties:
      hibernate:
        format_sql: false

app:
  docs:
    enabled: false
  admin:
    seed:
      enabled: false
    notification:
      pushProvider: ${ADMIN_NOTIF_PUSH_PROVIDER:DISABLED}
  security:
    identity-provider: local
  messaging:
    kafka:
      enabled: false
  otp:
    provider: msg91
    dev:
      enabled: false
  cors:
    allowedOrigins:
      - "https://admin.oolshik.in"
      - "https://www.oolshik.in"
  transcription:
    audioSourceMode: S3_ONLY

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN

media:
  storage: s3
  local:
    publicStreamEnabled: false
  s3:
    provider: aws
    region: ap-south-1
    prefix: audio/
    pathStyleAccessEnabled: false
    downloadUrlMode: presigned_get
    presignedGetTtlSeconds: 900
